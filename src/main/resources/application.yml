server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-usuarios
  cloud:
    compatibility-verifier:
      enabled: false
    inetutils:
      preferred-networks:
        - 10.0
    azure:
      active-directory:
        enabled: false

# Configuración Multi-Proveedor JWT (Azure Entra ID + AWS Cognito)
app:
  security:
    jwt:
      providers:
        # Accesos Azure Entra ID
        - name: azure
          jwk-set-uri: https://login.microsoftonline.com/dd140621-3398-4bfe-805b-9c162df51706/discovery/v2.0/keys
          issuers:
            - https://login.microsoftonline.com/dd140621-3398-4bfe-805b-9c162df51706/v2.0
            - https://sts.windows.net/dd140621-3398-4bfe-805b-9c162df51706/
          audiences:
            - 4a72e40f-1d5a-497a-b040-d2fa5acb61fd
            - cb8b1711-d599-4a45-94d9-9251f15db61a
            - api://cb8b1711-d599-4a45-94d9-9251f15db61a

        # Acceso AWS Cognito
        - name: cognito
          jwk-set-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EPwV5Yl4n/.well-known/jwks.json
          issuers:
            - https://cognito-idp.us-east-1.amazonaws.com/us-east-1_EPwV5Yl4n
          audiences:
            - 5qipn3rrr5j8uajmmsthq9i0cs
          default-role: Usuario

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always